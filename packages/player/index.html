<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniCV Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="app" class="theme-dark">
    <div class="app-shell">
        <header class="viewport-player">
            <div class="aspect-ratio-box">
                <iframe id="mainPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
                <div id="bootOverlay" class="boot-screen">
                    <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <p>INICIAR APRENDIZADO</p>
                </div>
            </div>
        </header>

        <section class="content-scroll">
            <div class="course-header">
                <div class="header-flex">
                    <div class="title-area">
                        <h1 id="currentTitle" class="course-title">Carregando...</h1>
                        <div class="progress-container">
                            <div class="progress-labels">
                                <span>Progresso Geral</span>
                                <strong id="percentTxt">0%</strong>
                            </div>
                            <div class="progress-track"><div id="pBar" class="progress-bar"></div></div>
                        </div>
                    </div>
                    <button id="themeToggle" class="theme-btn">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </div>

                <div class="main-actions">
                    <button id="prev" class="action-btn" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                    <button id="markBtn" class="action-btn primary-btn">MARCAR CONCLUÍDA</button>
                    <button id="next" class="action-btn" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
                </div>
            </div>

            <div class="playlist">
                <div id="videoList">
                    <!-- Skeleton Loader -->
                    <div class="video-item skeleton-item">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line long"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script>/* __UNICV_CONFIG__ */</script>
    <script src="scorm.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scorm-service.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/player.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
