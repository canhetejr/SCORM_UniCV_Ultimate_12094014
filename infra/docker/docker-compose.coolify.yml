# UniCV Studio — deploy via Docker (Coolify)
# Sem `ports:` para evitar "port is already allocated" no Coolify (proxy publica as portas).
# Build: contexto na raiz do repositório. Executar na raiz do repo:
#   docker compose -f infra/docker/docker-compose.coolify.yml build
#   docker compose -f infra/docker/docker-compose.coolify.yml up -d
#
# ENV REQUIRED em produção: ADMIN_USER, ADMIN_PASSWORD, COOKIE_SECRET, PUBLIC_BASE_URL
# DATABASE_URL é montado com host "db" (serviço Postgres). Volumes: unicv_pg, exports_data

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unicv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - unicv_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unicv"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/unicv?schema=public
      EXPORTS_DIR: ${EXPORTS_DIR:-/data/exports}
      VIMEO_CLIENT_ID: ${VIMEO_CLIENT_ID:-}
      VIMEO_CLIENT_SECRET: ${VIMEO_CLIENT_SECRET:-}
      VIMEO_REDIRECT_URI: ${VIMEO_REDIRECT_URI:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set-me}
      COOKIE_SECRET: ${COOKIE_SECRET:?set-me}
      ADMIN_USER: ${ADMIN_USER:?set-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set-me}
      LTI_PLATFORM_ISSUER: ${LTI_PLATFORM_ISSUER:-}
      LTI_PLATFORM_CLIENT_ID: ${LTI_PLATFORM_CLIENT_ID:-}
      LTI_PLATFORM_AUTH_LOGIN_URL: ${LTI_PLATFORM_AUTH_LOGIN_URL:-}
      LTI_PLATFORM_KEYSET_URL: ${LTI_PLATFORM_KEYSET_URL:-}
      LTI_PLATFORM_DEPLOYMENT_ID: ${LTI_PLATFORM_DEPLOYMENT_ID:-}
      LTI_TOOL_PRIVATE_KEY_PEM: ${LTI_TOOL_PRIVATE_KEY_PEM:-}
      LTI_TOOL_KID: ${LTI_TOOL_KID:-unicv-tool-1}
      LRS_ENDPOINT: ${LRS_ENDPOINT:-}
      LRS_BASIC_AUTH: ${LRS_BASIC_AUTH:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - exports_data:/data/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  unicv_pg:
  exports_data:
