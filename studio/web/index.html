<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniCV Studio</title>
    <script src="/config.js"></script>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: #0b1220; color: #e5e7eb; }
      a { color: #93c5fd; }
      input, textarea, button { font: inherit; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .card { background: #0f172a; border: 1px solid rgba(148,163,184,.2); border-radius: 12px; padding: 16px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .muted { color: #94a3b8; font-size: 13px; }
      .btn { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
      .btn.secondary { background: rgba(148,163,184,.16); }
      .btn:disabled { opacity: .6; cursor: not-allowed; }
      .field { display: grid; gap: 6px; margin: 10px 0; }
      .field input, .field textarea { background: #0b1220; border: 1px solid rgba(148,163,184,.25); border-radius: 10px; padding: 10px 12px; color: inherit; }
      .list { display: grid; gap: 10px; }
      .pill { display: inline-flex; gap: 8px; align-items: center; padding: 4px 10px; border-radius: 999px; background: rgba(148,163,184,.14); border: 1px solid rgba(148,163,184,.2); font-size: 12px; }
      .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
      .h { font-size: 20px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
